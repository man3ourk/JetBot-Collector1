
}
plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    namespace 'com.example.jetbot'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.jetbot"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
    
    // این بخش را اضافه کن تا خطا ندهد
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
}
