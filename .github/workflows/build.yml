name: Build JetBet APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4  # استفاده از آخرین نسخه از checkout

    - name: Set up JDK 17
      uses: actions/setup-java@v4  # استفاده از آخرین نسخه از setup-java
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4  # این همان نسخه حیاتی است که مشکلت را حل می‌کند
      with:
        name: JetBet-App
        path: app/build/outputs/apk/debug/app-debug.apk
